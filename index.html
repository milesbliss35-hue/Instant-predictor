<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Predictor</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#22c55e;--warn:#f59e0b;--err:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  header{padding:20px;text-align:center}
  header h1{margin:0;font-size:1.6rem}
  header p{margin:4px 0 0;color:var(--muted)}
  main{max-width:680px;margin:0 auto;padding:0 16px 40px}
  .card{background:var(--card);border-radius:12px;padding:18px;margin-bottom:16px}
  h2{margin:0 0 12px;font-size:1.1rem}
  label{display:block;margin:10px 0 4px;color:var(--muted);font-size:.9rem}
  input,select,textarea,button{width:100%;padding:11px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:var(--text);font-size:1rem;font-family:inherit}
  textarea{min-height:100px;resize:vertical}
  button{background:var(--accent);color:#052e16;font-weight:600;border:0;cursor:pointer;margin-top:12px}
  button:disabled{opacity:.5;cursor:not-allowed}
  #preview{max-width:100%;max-height:260px;margin-top:10px;border-radius:8px;display:none}
  .result{background:#0f172a;border-radius:8px;padding:12px;margin-top:10px}
  .result b{color:var(--accent)}
  .note{font-size:.85rem;color:var(--warn);margin-top:8px}
  .msg{margin-top:10px;font-size:.95rem}
  .err{color:var(--err)}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:0 16px 30px}
</style>
</head>
<body>
<header>
  <h1>⚽ Score Predictor</h1>
  <p>Upload a betting slip screenshot and get a score estimate</p>
</header>

<main>
  <section class="card">
    <h2>1. Upload screenshot</h2>
    <input type="file" id="shot" accept="image/*">
    <img id="preview" alt="Screenshot preview">
    <div class="msg" id="ocrStatus"></div>
  </section>

  <section class="card">
    <h2>2. Read &amp; predict</h2>
    <label for="fixtures">Optional: add or type matches yourself, one per line</label>
    <textarea id="fixtures" placeholder="Arsenal vs Chelsea&#10;Hearts of Oak vs Asante Kotoko"></textarea>
    <button id="predictBtn">Read screenshot &amp; predict</button>
    <div id="results"></div>
  </section>

  <section class="card">
    <h2>3. Pay with Mobile Money</h2>
    <label for="network">Network</label>
    <select id="network">
      <option value="mtn">MTN MoMo</option>
      <option value="telecel">Telecel Cash</option>
      <option value="airteltigo">AirtelTigo Money</option>
    </select>
    <label for="phone">Mobile money number</label>
    <input id="phone" type="tel" inputmode="numeric" placeholder="024XXXXXXX">
    <label for="amount">Amount (GHS)</label>
    <input id="amount" type="number" min="1" value="5">
    <label for="email">Email (for receipt)</label>
    <input id="email" type="email" placeholder="you@example.com">
    <button id="payBtn">Pay</button>
    <div id="otpBox" style="display:none">
      <label for="otp">Enter the code you received</label>
      <input id="otp" inputmode="numeric" autocomplete="one-time-code">
      <button id="otpBtn">Submit code</button>
    </div>
    <div class="msg" id="payMsg"></div>
  </section>
</main>

<footer>
  18+ only. Predictions are estimates, not guarantees, and no one can promise a win. Bet responsibly.
</footer>

<script>
const $ = id => document.getElementById(id);

// ---- 1. Screenshot upload (resized in the browser before sending) ----
let imageData = null;

function resize(file, max = 2000) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.9));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

$('shot').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    imageData = await resize(file);
    const img = $('preview');
    img.src = imageData;
    img.style.display = 'block';
    $('ocrStatus').textContent = 'Screenshot ready. Press "Read screenshot & predict".';
  } catch (err) {
    imageData = null;
    $('ocrStatus').textContent = 'Could not open that image.';
  }
});

// ---- 2. Read screenshot + predict ----
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function verdict(p) {
  return p.home > p.away ? 'Home win' : p.home < p.away ? 'Away win' : 'Draw';
}

async function runPredict() {
  const box = $('results');
  const typed = $('fixtures').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!imageData && !typed.length) { box.innerHTML = '<p class="msg err">Upload a screenshot first.</p>'; return; }

  box.innerHTML = '<p class="msg">Reading the screenshot and predicting…</p>';
  $('predictBtn').disabled = true;
  try {
    const res = await fetch('/api/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: imageData, matches: typed, reference: paidReference })
    });
    const d = await res.json().catch(() => ({}));
    if (res.status === 402) { box.innerHTML = '<p class="msg err">Please complete payment (step 3) first. Your screenshot will be read right after payment.</p>'; return; }
    if (!res.ok) { box.innerHTML = '<p class="msg err">' + escapeHtml(d.message || 'Something went wrong.') + '</p>'; return; }
    if (!d.predictions || !d.predictions.length) {
      box.innerHTML = '<p class="msg err">No matches found.' + (d.problem ? ' Reason: ' + escapeHtml(d.problem) + '.' : '') + ' Try a clearer screenshot, or type the matches in the box above.</p>';
      return;
    }
    box.innerHTML = d.predictions.map(p => `
      <div class="result">
        ${escapeHtml(p.match)}<br>
        Predicted score: <b>${p.home} - ${p.away}</b> (${verdict(p)})
        ${p.note ? '<div class="note">' + escapeHtml(p.note) + '</div>' : ''}
      </div>`).join('') +
      '<div class="note">AI estimates from general team knowledge, with no live data. Not a guarantee.</div>';
  } catch (e) {
    box.innerHTML = '<p class="msg err">Could not reach the server.</p>';
  } finally {
    $('predictBtn').disabled = false;
  }
}
$('predictBtn').addEventListener('click', runPredict);

// ---- 3. Mobile money via /api/pay ----
let paidReference = null;
let pendingRef = null;
const say = (t, err) => { const m = $('payMsg'); m.className = 'msg' + (err ? ' err' : ''); m.textContent = t; };
const post = (url, body) => fetch(url, {
  method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
}).then(async r => ({ ok: r.ok, d: await r.json().catch(() => ({})) }));

async function poll(reference) {
  for (let i = 0; i < 24; i++) {                 // about 2 minutes
    await new Promise(r => setTimeout(r, 5000));
    try {
      const d = await (await fetch('/api/verify?reference=' + encodeURIComponent(reference))).json();
      if (d.status === 'success') { paidReference = reference; say('Payment received.'); if (imageData) runPredict(); return; }
      if (d.status === 'failed' || d.status === 'abandoned') { say(d.message || 'Payment failed.', true); return; }
    } catch (e) { /* keep waiting */ }
  }
  say('Still waiting for approval. Approve the prompt on your phone, then press Pay again.', true);
}

function handleCharge(d) {
  pendingRef = d.reference;
  $('otpBox').style.display = d.status === 'send_otp' ? 'block' : 'none';
  if (d.status === 'success') { paidReference = d.reference; say('Payment received.'); if (imageData) runPredict(); }
  else if (d.status === 'send_otp') say(d.message || 'Enter the code sent to your phone.');
  else if (d.status === 'failed') say(d.message || 'Payment failed.', true);
  else { say(d.message || 'Approve the prompt on your phone.'); poll(d.reference); }
}

$('payBtn').addEventListener('click', async () => {
  const phone = $('phone').value.replace(/\s/g, '');
  const amount = Number($('amount').value);
  const email = $('email').value.trim();
  if (!/^(0\d{9}|\+?233\d{9})$/.test(phone)) return say('Enter a valid Ghana number.', true);
  if (!/^\S+@\S+\.\S+$/.test(email)) return say('Enter a valid email.', true);
  if (!(amount > 0)) return say('Enter a valid amount.', true);

  $('payBtn').disabled = true;
  say('Sending payment request…');
  try {
    const { ok, d } = await post('/api/pay', { network: $('network').value, phone, email, amount });
    if (!ok) say(d.message || 'Payment could not be started.', true);
    else handleCharge(d);
  } catch (e) {
    say('Could not reach the server. No money was taken.', true);
  } finally {
    $('payBtn').disabled = false;
  }
});

$('otpBtn').addEventListener('click', async () => {
  const otp = $('otp').value.trim();
  if (!otp || !pendingRef) return say('Enter the code first.', true);
  try {
    const { ok, d } = await post('/api/pay', { action: 'otp', otp, reference: pendingRef });
    if (!ok) say(d.message || 'Code not accepted.', true);
    else handleCharge(d);
  } catch (e) { say('Could not reach the server.', true); }
});
</script>
</body>
</html>
